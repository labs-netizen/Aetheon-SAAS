name: Aetheon SaaS CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate-web:
    name: Next.js Frontend, RLS & E2E Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Typecheck
        run: npm run typecheck

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Local Supabase Stack
        run: |
          supabase start
          supabase db reset
          supabase status -o env >> $GITHUB_ENV

      - name: Configure Test Environment from Supabase
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY}" >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}" >> $GITHUB_ENV
          echo "DATABASE_URL=${DB_URL}" >> $GITHUB_ENV

      - name: Seed Authentication Users
        run: node scripts/seed_auth_users.mjs

      - name: Run Unit, RLS & Adversarial API Tests
        run: npm test

      - name: Next.js Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - name: Setup Python for Analytics Microservice
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Start Analytics Microservice in Background
        run: |
          cd services/analytics
          pip install -r requirements.txt
          nohup uvicorn main:app --host 0.0.0.0 --port 8000 &
          echo "Waiting for FastAPI to become healthy..."
          for i in {1..30}; do
            if curl -s http://127.0.0.1:8000/health | grep -q "healthy"; then
              echo "FastAPI is up and healthy!"
              break
            fi
            sleep 1
          done
        env:
          ANALYTICS_SERVICE_TOKEN: fixture-ci-analytics-token

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests (Non-Demo / Production-like)
        run: npx playwright test --project=non-demo
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          ANALYTICS_SERVICE_URL: http://127.0.0.1:8000
          ANALYTICS_SERVICE_TOKEN: fixture-ci-analytics-token

      - name: Run Playwright E2E Tests (Demo Mode)
        run: npx playwright test --project=demo
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          ANALYTICS_SERVICE_URL: http://127.0.0.1:8000
          ANALYTICS_SERVICE_TOKEN: fixture-ci-analytics-token
          NEXT_PUBLIC_DEMO_MODE: 'true'

  validate-analytics:
    name: Python Analytics Microservice Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        run: |
          cd services/analytics
          pip install -r requirements.txt

      - name: Run Pytest Test Suite
        run: |
          cd services/analytics
          pytest tests/ -v
        env:
          ANALYTICS_SERVICE_TOKEN: fixture-ci-analytics-token
